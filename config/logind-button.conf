# Installed by jellyrip setup/03-discrip.sh as
# /etc/systemd/logind.conf.d/50-discrip-button.conf.
# The power button (gpio-shutdown overlay, [power] button_gpio) sends KEY_POWER.
# Hold it 5 s to shut down; a short press does nothing, so a knock can't cancel
# a rip.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff

# discrip configuration. Installed to /opt/discrip/discrip.toml by setup/03-discrip.sh
# (only if absent, so local edits survive re-installs). Unset keys use the defaults
# in lib/discrip.py.

[paths]
media = "/srv/media"
state_dir = "/var/lib/discrip"
run_dir = "/run/discrip"

[drive]
# First existing path wins. The by-id link is stable across USB re-enumeration.
device = [
    "/dev/disk/by-id/usb-PIONEER_DVD-RW_DVRTD11RS_534743333230303839392020-0:0",
    "/dev/sr0",
]
poll_interval = 2        # seconds between CDROM_DRIVE_STATUS polls
unresponsive_after = 30  # seconds of failed/stuck polls before "drive not responding"
ready_timeout = 60       # dispatch: seconds to wait for "disc ready"

[dispatch]
auto_start = true        # start a rip when a disc becomes ready
rip_unit = "discrip-rip.service"
eject_when_done = true
min_free_gb = 25         # refuse to rip below this much free space in [paths] media

[jellyfin]
# Ask Jellyfin to rescan after every move into the library. Its folder watcher
# skips library folders that were empty at the last scan, so it can't be relied on.
url = "http://localhost:8096"
api_key = ""               # Dashboard -> API Keys; empty disables refreshes

[audio]
abcde_conf = "/opt/discrip/abcde.conf"  # installed from config/abcde.conf
rip_timeout = 3600

[web]
port = 8080
token = ""                 # shared secret for the web app's buttons; 03-discrip.sh fills it in

[notify]
jellyfin_popup = true      # pop up prompts and failures in open Jellyfin apps (web, phone)
popup_seconds = 0          # 0 = dialog that stays until OK; >0 = brief toast (Jellyfin ignores the length)

[state]
history_max = 50         # jobs kept in state.json history

[video]
minlength = 600            # seconds; shorter titles are ignored (menus, trailers)
film_min = 3600            # a film's main title is at least this long
episode_min = 1080         # season discs: episodes are 18-70 min ...
episode_max = 4200
episode_tolerance = 0.2    # ... and within 20% of the group median
season_min_titles = 3
max_candidates = 12        # more titles than this: ask instead of guessing (decoys)
duplicate_tolerance = 0.02 # more than one title this close to the longest: ask
scan_timeout = 1800        # protected discs take up to ~15 min to scan
rip_timeout = 14400
tv_confirm = "when_unsure" # TV plans: "always" ask, ask "when_unsure", or "never" ask
tv_lookup = true           # episode names from TVmaze (api.tvmaze.com; names only, never order)
# Trailing words/phrases stripped from disc labels, and labels that are no name at all.
label_noise = ["WS", "FS", "PAL", "NTSC", "DVD", "BLURAY", "BD", "R1", "R2", "UK", "SE",
               "SPECIAL EDITION", "COLLECTORS EDITION", "FAM FUN EDITION",
               "FAMILY FUN EDITION", "WIDESCREEN"]
junk_labels = ["DVD", "DVD_VIDEO", "DVDVIDEO", "DVDVOLUME", "VIDEO_TS", "LOGICAL_VOLUME_ID",
               "DISC", "MOVIE", "FILM", "VOLUME", "NO_LABEL", "UNTITLED"]

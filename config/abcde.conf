# abcde config for discrip (spec 7.2). Installed to /opt/discrip/abcde.conf.
# lib/audio.py runs: abcde -N -c abcde.conf -d <dev> <first>-<last audio track>
# with DISCRIP_WORKDIR set; the finished Artist/Album folder is then moved into
# the library by discrip, so abcde itself never writes outside _work.

CDDBMETHOD=musicbrainz
CDROMREADERSYNTAX=cdparanoia
CDPARANOIAOPTS="--never-skip=40"

OUTPUTTYPE=flac
FLACOPTS="--best"
ACTIONS=cddb,read,encode,tag,move,clean

OUTPUTDIR="${DISCRIP_WORKDIR}"
WAVOUTPUTDIR="${DISCRIP_WORKDIR}"
OUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM} - ${TRACKFILE}'
VAOUTPUTFORMAT='Various Artists/${ALBUMFILE}/${TRACKNUM} - ${ARTISTFILE} - ${TRACKFILE}'
ONETRACKOUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${ALBUMFILE}'
VAONETRACKOUTPUTFORMAT='Various Artists/${ALBUMFILE}/${ALBUMFILE}'
PADTRACKS=y

# Read the next track while encoding the last one (the Pi 4 has 4 cores).
MAXPROCS=2
EJECTCD=n
INTERACTIVE=n

# Keep spaces and case; only make names safe as path components.
mungefilename ()
{
	echo "$@" | sed -e 's/^\.*//' -e 's/[\/]/-/g' -e 's/[[:cntrl:]]//g' \
		-e 's/[:*?"<>|]/_/g' -e 's/[. ]*$//'
}

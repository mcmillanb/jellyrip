# /etc/fanctl.conf: settings for fanctl.service (installed by setup/10-fan.sh,
# kept on re-install). After a change: sudo systemctl restart fanctl
# All percentages are FAN speed; the inversion is handled by "invert".

[pwm]
chip = auto        # pwmchip number in /sys/class/pwm, or auto = the PWM0 controller (fe20c000.pwm)
channel = 0        # GPIO 18 is PWM0 channel 0
gpio = 18          # for messages only; the pin is chosen by dtoverlay=pwm in config.txt
frequency = 25000  # Hz (Intel 4-pin fan spec)
invert = yes       # NPN transistor: GPIO high pulls the fan's PWM line low = slower

[control]
interval = 5       # seconds between temperature readings
# temperature C : fan %, linear between points; below the first point the fan stops,
# above the last it stays at the last value. The 0:20 point keeps the fan at a silent
# 20% even when cool: stopping below 42-45 C made it start and stop every 2 min at idle.
curve = 0:20 45:20 55:30 65:40 72:50 75:100
stop_below = 42    # once running, the fan only stops below this (hysteresis; unused while
                   # the curve starts at 0 C)
kick_percent = 40  # starting from stopped: run at this % ...
kick_seconds = 2   # ... for this long first
max_step = 10      # largest change per reading, in % (smoothing)
